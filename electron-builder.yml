appId: com.vitals.hud
productName: Vitals
copyright: Copyright © 2026 Hugo Bicalho

directories:
  output: dist
  buildResources: build

# Só o bundle compilado + package.json. O sensor .ps1 vai em out/main e é
# copiado para %TEMP% em runtime (não precisa de asarUnpack).
files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

portable:
  artifactName: Vitals-${version}-portatil.${ext}

nsis:
  artifactName: Vitals-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vitals
  runAfterFinish: true
  deleteAppDataOnUninstall: false
